<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="coldtrackGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563EB" />
      <stop offset="50%" stop-color="#0284C7" />
      <stop offset="100%" stop-color="#06B6D4" />
    </linearGradient>
    <linearGradient id="iceShine" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0" />
    </linearGradient>
  </defs>
  
  <!-- Base Background con esquinas redondeadas -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#coldtrackGrad)" />
  <rect x="2" y="2" width="60" height="30" rx="16" fill="url(#iceShine)" />
  <rect x="2" y="2" width="60" height="60" rx="16" stroke="#93C5FD" stroke-width="1.5" stroke-opacity="0.6" />
  
  <!-- Icono Copo de Nieve ColdTrack -->
  <g stroke="#FFFFFF" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" transform="translate(8, 8) scale(2)">
    <line x1="12" y1="2" x2="12" y2="22" />
    <line x1="2" y1="12" x2="22" y2="12" />
    <line x1="20" y1="20" x2="4" y2="4" />
    <line x1="20" y1="4" x2="4" y2="20" />
    <polyline points="10 4 12 2 14 4" />
    <polyline points="10 20 12 22 14 20" />
    <polyline points="20 10 22 12 20 14" />
    <polyline points="4 10 2 12 4 14" />
    <polyline points="14 4 14 8 18 8" />
    <polyline points="4 14 8 14 8 18" />
    <polyline points="20 14 16 14 16 18" />
